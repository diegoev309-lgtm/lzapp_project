{% extends "masterpage_dashboard.html" %}
{% load static %}

{% block content %}

<div class="overlay">

    <div class="modal-formulario">

        <div class="header-form">
            <h2><i class="bi bi-person-workspace"></i> Registrar empleado</h2>
            <p>Completa los datos para dar de alta a un nuevo empleado.</p>
        </div>

        <div class="card-form">

            <form method="post">
                {% csrf_token %}

                <div class="form-grid">
                    {{ form.as_p }}
                </div>

                <div class="botones">
                    <a href="{% url 'Usuario' %}" class="btn-volver">
                        <i class="bi bi-arrow-left"></i> Volver
                    </a>
                    <button type="submit" class="btn-guardar">
                        <i class="bi bi-check-circle-fill"></i> Registrar empleado
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
