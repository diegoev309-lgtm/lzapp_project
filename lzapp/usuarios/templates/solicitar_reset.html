<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña | LzApp</title>

```
<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:20px;
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background:
            radial-gradient(circle at top left, #1e3a8a 0%, #0f172a 45%, #020617 100%);
    }

    .reset-card{
        width:100%;
        max-width:520px;
        background:#0f172a;
        border:1px solid rgba(255,255,255,.08);
        border-radius:30px;
        padding:45px 40px;
        box-shadow:
            0 25px 70px rgba(0,0,0,.6),
            0 0 0 1px rgba(255,255,255,.03);
    }

    .logo-box{
        width:95px;
        height:95px;
        margin:0 auto 28px;
        border-radius:24px;
        background:#E4C870;
        display:flex;
        align-items:center;
        justify-content:center;
        box-shadow:0 12px 25px rgba(228,200,112,.25);
    }

    .logo-box svg{
        width:52px;
        height:52px;
    }

    .title{
        text-align:center;
        color:#ffffff;
        font-size:34px;
        font-weight:800;
        margin-bottom:14px;
    }

    .subtitle{
        text-align:center;
        color:#cbd5e1;
        font-size:15px;
        line-height:1.7;
        margin-bottom:32px;
    }

    .alert{
        padding:14px 16px;
        border-radius:14px;
        margin-bottom:24px;
        font-size:14px;
        border:1px solid transparent;
    }

    .alert-success{
        background:rgba(34,197,94,.12);
        color:#bbf7d0;
        border-color:rgba(34,197,94,.25);
    }

    .alert-error,
    .alert-danger{
        background:rgba(239,68,68,.12);
        color:#fecaca;
        border-color:rgba(239,68,68,.25);
    }

    .divider{
        height:1px;
        margin:28px 0;
        background:linear-gradient(
            to right,
            transparent,
            rgba(255,255,255,.15),
            transparent
        );
    }

    .form-group{
        margin-bottom:24px;
    }

    .form-label{
        display:block;
        margin-bottom:10px;
        color:#f8fafc;
        font-weight:700;
        font-size:15px;
    }

    .form-control{
        width:100%;
        padding:15px 16px;
        border-radius:15px;
        border:1px solid #334155;
        background:#172554;
        color:#ffffff;
        font-size:15px;
        transition:.25s ease;
    }

    .form-control::placeholder{
        color:#94a3b8;
    }

    .form-control:focus{
        outline:none;
        border-color:#E4C870;
        background:#1e3a8a;
        box-shadow:0 0 0 4px rgba(228,200,112,.15);
    }

    .btn-submit{
        width:100%;
        border:none;
        border-radius:15px;
        padding:15px 18px;
        background:#E4C870;
        color:#111827;
        font-size:16px;
        font-weight:800;
        cursor:pointer;
        display:flex;
        align-items:center;
        justify-content:center;
        gap:10px;
        transition:.2s ease;
    }

    .btn-submit:hover{
        background:#F3DA88;
        transform:translateY(-2px);
        box-shadow:0 14px 28px rgba(228,200,112,.22);
    }

    .btn-submit svg{
        width:18px;
        height:18px;
    }

    .back-link{
        margin-top:28px;
        text-align:center;
    }

    .back-link a{
        color:#E4C870;
        text-decoration:none;
        font-weight:700;
        transition:opacity .2s ease;
    }

    .back-link a:hover{
        opacity:.85;
        text-decoration:underline;
    }

    @media (max-width:576px){

        .reset-card{
            padding:36px 24px;
            border-radius:24px;
        }

        .title{
            font-size:28px;
        }
    }

</style>
```

</head>

<body>

```
<div class="reset-card">

    <div class="logo-box">

        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

            <path d="M7 11V8a5 5 0 1110 0v3"
                  stroke="#111827"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>

            <rect x="5"
                  y="11"
                  width="14"
                  height="10"
                  rx="2"
                  stroke="#111827"
                  stroke-width="2"/>

        </svg>

    </div>

    <h1 class="title">
        Recuperar contraseña
    </h1>

    <p class="subtitle">
        Ingresa el correo electrónico asociado a tu cuenta y te enviaremos un enlace seguro para restablecer tu contraseña.
    </p>

    {% if messages %}

        {% for message in messages %}

            <div class="alert alert-{{ message.tags }}">

                {{ message }}

            </div>

        {% endfor %}

    {% endif %}

    <div class="divider"></div>

    <form method="post">

        {% csrf_token %}

        <div class="form-group">

            <label for="email" class="form-label">

                Correo electrónico

            </label>

            <input type="email"
                   name="email"
                   id="email"
                   class="form-control"
                   placeholder="ejemplo@correo.com"
                   required>

        </div>

        <button type="submit" class="btn-submit">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 xmlns="http://www.w3.org/2000/svg">

                <path d="M4 4h16v16H4z"
                      stroke="#111827"
                      stroke-width="2"/>

                <path d="m4 8 8 5 8-5"
                      stroke="#111827"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"/>

            </svg>

            Enviar enlace de recuperación

        </button>

    </form>

    <div class="back-link">

        <a href="{% url 'login' %}">

            ← Volver al inicio de sesión

        </a>

    </div>

</div>
```

</body>
</html>
