<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
    <div style="max-width: 500px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 30px; text-align: center;">
        <img src="cid:logo_lacz" alt="LzApp" style="max-width: 150px; margin-bottom: 20px;">
        <h2>Recupera tu contraseña</h2>
        <p>Hola {{ nombre }},</p>
        <p>Recibimos una solicitud para restablecer tu contraseña en LzApp. Haz clic en el botón de abajo para continuar:</p>
        <a href="{{ enlace_reset }}" style="display: inline-block; background-color: #007bff; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 5px; margin: 20px 0;">
            Restablecer contraseña
        </a>
        <p style="color: #888; font-size: 13px;">Si tú no solicitaste esto, puedes ignorar este correo.</p>
        <p style="color: #888; font-size: 13px;">Este enlace expirará en unos días por seguridad.</p>
    </div>
</body>
</html>
