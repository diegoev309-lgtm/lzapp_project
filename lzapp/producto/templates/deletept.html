{% extends "masterpage_dashboard.html" %}
{% load static %}

{% block content %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<style>

/*==========================
        FONDO
===========================*/

.overlay{

    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
    z-index:9999;

}

/*==========================
        MODAL
===========================*/

.modal-eliminar{

    width:100%;
    max-width:500px;

    background:var(--bg-panel);

    border:1px solid var(--border-subtle);

    border-radius:var(--radius-panel);

    overflow:hidden;

    box-shadow:0 20px 50px rgba(0,0,0,.5);

    animation:aparecer .35s ease;

}

/*==========================
      ENCABEZADO
===========================*/

.header-modal{

    background:linear-gradient(135deg,#7f1d1d, var(--red));

    color:white;

    padding:25px;

    text-align:center;

}

.header-modal i{

    font-size:56px;

    margin-bottom:15px;

}

.header-modal h2{

    margin:0;

    font-size:24px;

    font-weight:700;

}

/*==========================
         CUERPO
===========================*/

.body-modal{

    padding:30px;

    text-align:center;

}

.body-modal p{

    color:var(--text-secondary);

    margin-bottom:15px;

    font-size:16px;

}

.nombre-producto{

    background:var(--red-dim);

    border:1px solid rgba(239,68,68,.35);

    color:var(--red);

    font-size:19px;

    font-weight:700;

    padding:15px;

    border-radius:12px;

    margin-bottom:30px;

}

/*==========================
        BOTONES
===========================*/

.footer-modal{

    display:flex;

    justify-content:center;

    gap:15px;

}

.btn-cancelar{

    background:rgba(255,255,255,.06);

    color:var(--text-primary);

    border:1px solid var(--border-hair);

    padding:10px 22px;

    border-radius:10px;

    text-decoration:none;

    transition:.3s;

}

.btn-cancelar:hover{

    background:rgba(255,255,255,.1);

    color:var(--text-primary);

    border-color:rgba(255,255,255,.25);

    transform:translateY(-2px);

}

.btn-eliminar{

    background:var(--red);

    color:white;

    border:none;

    padding:10px 22px;

    border-radius:10px;

    font-weight:600;

    transition:.3s;

}

.btn-eliminar:hover{

    background:#c1352f;

    color:white;

    transform:translateY(-2px);

    box-shadow:0 10px 22px rgba(239,68,68,.3);

}

/*==========================
      ANIMACIÓN
===========================*/

@keyframes aparecer{

    from{

        opacity:0;
        transform:scale(.9) translateY(-20px);

    }

    to{

        opacity:1;
        transform:scale(1) translateY(0);

    }

}

/*==========================
      RESPONSIVE
===========================*/

@media(max-width:576px){

    .modal-eliminar{

        max-width:95%;

    }

    .header-modal h2{

        font-size:20px;

    }

    .footer-modal{

        flex-direction:column;

    }

    .btn-cancelar,
    .btn-eliminar{

        width:100%;

    }

}

</style>

<div class="overlay">

    <div class="modal-eliminar">

        <div class="header-modal">

            <i class="bi bi-exclamation-triangle-fill"></i>

            <h2>

                Confirmar Eliminación

            </h2>

        </div>

        <div class="body-modal">

            <p>

                ¿Está seguro de que desea eliminar el siguiente producto?

            </p>

            <div class="nombre-producto">

                {{ producto.nombre }}

            </div>

            <form method="POST">

                {% csrf_token %}

                <div class="footer-modal">

                    <a href="{% url 'listar_productos' %}"

                       class="btn btn-cancelar">

                        <i class="bi bi-arrow-left"></i>

                        Cancelar

                    </a>

                    <button type="submit"

                            class="btn btn-eliminar">

                        <i class="bi bi-trash-fill"></i>

                        Eliminar

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
