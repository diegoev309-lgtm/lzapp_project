<div class="mb-3">
    <label class="form-label">Ubicación de entrega</label>

    <div id="mapa-ubicacion" style="height: 300px; width: 100%; border-radius: 8px; background:#1a1a1a; display:flex; align-items:center; justify-content:center; color:#888;">
        <span id="mapa-placeholder">El mapa se activará cuando tengamos el API key de Google Maps</span>
    </div>

    <div class="mt-2 d-flex gap-2 align-items-center">
        <button type="button" id="btn-usar-gps" class="dash-btn-primary">📍 Usar mi ubicación</button>
        <span id="estado-ubicacion" class="text-muted small"></span>
    </div>

    <!-- Campos ocultos que se envían junto con el resto del formulario del pedido -->
    <input type="hidden" name="cliente_latitud" id="cliente_latitud">
    <input type="hidden" name="cliente_longitud" id="cliente_longitud">
</div>
