<div id="mapa-ubicacion" style="height: 350px; width: 100%; border-radius: 8px;"></div>

<div class="mt-2 d-flex gap-2">
    <input type="text" id="buscador-direccion" class="form-control" placeholder="Escribe tu dirección...">
    <button type="button" id="btn-usar-gps" class="dash-btn-primary">📍 Usar mi ubicación</button>
</div>

<!-- Campos ocultos que se llenan por JS y se envían con el form -->
<input type="hidden" name="cliente_latitud" id="cliente_latitud">
<input type="hidden" name="cliente_longitud" id="cliente_longitud">
<input type="hidden" name="cliente_direccion" id="cliente_direccion">

<!-- Al final del template, cuando ya tengas la key -->
<script src="https://maps.googleapis.com/maps/api/js?key={{ GOOGLE_MAPS_API_KEY }}&libraries=places&callback=initMapaUbicacion" async defer></script>
