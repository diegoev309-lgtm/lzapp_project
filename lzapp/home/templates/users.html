{% extends "masterpage.html" %}

{% block title %}Usuarios - LzApp{% endblock %}

{% load static %}

{% block navbar_actions %}
<style>

/* Botón Iniciar sesión (estilo "ghost", sobre el navbar azul) */
.btn-login{
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(255,255,255,.08);
    color: #fff;
    border: 1.5px solid rgba(255,255,255,.55);
    border-radius: 30px;
    padding: 7px 14px;
    font-weight: 500;
    font-size: .85rem;
    transition: background .3s, border-color .3s, transform .3s, box-shadow .3s;
}

.btn-login:hover{
    background: rgba(255,255,255,.16);
    border-color: #fff;
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0,0,0,.15);
}

.btn-login i{
    font-size: .9rem;
}

.btn-register{
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: linear-gradient(135deg, #d9b95c, #c9a84c);
    color: #022C63;
    border-radius: 30px;
    padding: 7px 16px;
    font-weight: 700;
    font-size: .85rem;
    border: none;
    box-shadow: 0 4px 12px rgba(201,168,76,.35);
    transition: background .3s, transform .3s, box-shadow .3s;
}

.btn-register:hover{
    background: linear-gradient(135deg, #e8c874, #d9b95c);
    color: #022C63;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(201,168,76,.5);
}

.btn-register i{
    font-size: .9rem;
}

@media (max-width: 480px){
    .btn-login, .btn-register{
        padding: 6px 12px;
        font-size: .78rem;
    }
}

</style>
<ul class="nav justify-content-end align-items-center gap-2">

    <!-- Carrito: visitantes también pueden armar carrito (queda en su
         sesión) -- antes no tenían ninguna forma de verlo sin conocer
         la URL de memoria. Abre el panel deslizante, igual que en
         clients.html (ver JS al final de carrito/widget.html). -->
    <li class="nav-item">
        <a class="nav-link p-1 nav-link-icon nav-link-carrito{% if carrito_cantidad_items %} tiene-items{% endif %}" href="{% url 'carro' %}" title="Carrito de compras">
            <i class="bi bi-cart3 fs-4"></i>
            <span class="carrito-badge{% if carrito_cantidad_items %} visible{% endif %}">{{ carrito_cantidad_items|default:0 }}</span>
        </a>
    </li>

    <li class="nav-item me-2">
        <a class="btn btn-login" href="{% url 'login' %}">
            <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
        </a>
    </li>

    <li class="nav-item">
        <a class="btn btn-register" href="{% url 'registro' %}">
            <i class="bi bi-person-plus-fill"></i> Registrarse
        </a>
    </li>

</ul>
{% endblock %}
