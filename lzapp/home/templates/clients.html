{% extends "masterpage.html" %}

{% block title %}Clientes - LzApp{% endblock %}

{% load static %}

{% block navbar_actions %}
<ul class="nav justify-content-end align-items-center gap-2">

    <!-- Perfil -->
    <li class="nav-item dropdown">

        <a class="nav-link dropdown-toggle p-1"
           href="#"
           id="perfilDropdown"
           role="button"
           data-bs-toggle="dropdown"
           aria-expanded="false">

            <i class="bi bi-person-circle fs-4"></i>

        </a>

        <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 p-2" style="min-width: 240px; border-radius: 14px;">

    <li class="px-2 py-2 d-flex align-items-center gap-2">
        <div class="d-flex align-items-center justify-content-center rounded-circle"
             style="width: 38px; height: 38px; background: #1a3d7c; color: #fff; font-weight: 600;">
            {{ request.session.nombre|slice:":1"|upper }}
        </div>
        <div>
            <div class="fw-bold" style="font-size: .92rem; line-height: 1.1;">
                {{ request.session.nombre }}
            </div>
            <div class="text-muted" style="font-size: .75rem;">
                👋 ¡Bienvenido de nuevo!
            </div>
        </div>
    </li>

    <li><hr class="dropdown-divider my-2"></li>

    <li>
        <a class="dropdown-item d-flex align-items-center gap-2 rounded-3 py-2"
           href="{% url 'configuracion' %}">
            <i class="bi bi-person-circle" style="font-size: 1.05rem; color: #1a3d7c;"></i>
            <span>Mi Perfil</span>
        </a>
    </li>

    <li><hr class="dropdown-divider my-2"></li>

    <li>
        <a class="dropdown-item d-flex align-items-center gap-2 rounded-3 py-2 text-danger"
           href="{% url 'logout' %}">
            <i class="bi bi-box-arrow-right" style="font-size: 1.05rem;"></i>
            <span>Cerrar sesión</span>
        </a>
    </li>

</ul>
    </li>

    <!-- Carrito -->
    <li class="nav-item">
        <a class="nav-link p-1" href="{% url 'carro' %}" title="Carrito de compras">
            <i class="bi bi-basket fs-4"></i>
        </a>
    </li>

</ul>
{% endblock %}
